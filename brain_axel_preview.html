<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#110c29">
  <title>브레인 악셀 — 30초 키네틱 타이포그래피</title>
  <style>
    :root { color-scheme: dark; --lime:#bcff36; --coral:#ff654d; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:28px; display:grid; place-items:center; background:#080711; color:#faf7ff; font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
    .wrap { width:min(100%,1100px); }
    .stage { position:relative; overflow:hidden; aspect-ratio:16/9; border:1px solid #d2cdf44d; border-radius:18px; background:#110c29; box-shadow:0 24px 90px #0009; }
    canvas { display:block; width:100%; height:100%; }
    .controls { display:flex; align-items:center; flex-wrap:wrap; gap:14px; margin-top:18px; }
    button { border:0; border-radius:999px; padding:12px 20px; color:#17102b; background:var(--lime); font:700 15px "Malgun Gothic", sans-serif; cursor:pointer; }
    button:hover { filter:brightness(1.08); } button:focus-visible { outline:3px solid white; outline-offset:3px; }
    .readout { color:#d0c7e4; font-size:13px; }
    audio { display:block; width:min(100%,560px); height:36px; margin-top:12px; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="stage" aria-label="브레인 악셀 키네틱 타이포그래피 미리보기">
      <canvas id="canvas" width="1280" height="720" aria-label="브레인 악셀 영상 화면"></canvas>
    </section>
    <div class="controls">
      <button id="play" type="button">영상 + 음악 재생</button>
      <span class="readout" id="readout">30초 · 16:9 · 144 BPM</span>
    </div>
    <audio id="audio" controls preload="metadata" src="brain_axel_music.wav" aria-label="브레인 악셀 오리지널 음악"></audio>
  </main>
  <script>
    const W=1280,H=720,canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');
    const audio=document.querySelector('#audio'),readout=document.querySelector('#readout');
    let started=0,playing=false,raf=0;
    const lime='#bcff36',coral='#ff654d',white='#faf7ff',muted='#cdc5e0';
    function text(s,x,y,size,color=white,weight=800,align='center',stroke=0){
      ctx.textAlign=align;ctx.textBaseline='middle';ctx.font=`${weight} ${size}px "Malgun Gothic",Arial,sans-serif`;
      if(stroke){ctx.lineWidth=stroke;ctx.strokeStyle='#0f0920';ctx.strokeText(s,x,y)}ctx.fillStyle=color;ctx.fillText(s,x,y);
    }
    function rr(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
    function render(t){
      t=Math.max(0,Math.min(30,t));const scene=Math.min(2,Math.floor(t/10)),local=t-scene*10,pulse=(1+Math.sin(2*Math.PI*t/(60/144)))/2;
      const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#110c29');grad.addColorStop(1,'#2f1349');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
      const glow=ctx.createRadialGradient(1050,80,10,1050,80,500);glow.addColorStop(0,'#ce36421c');glow.addColorStop(1,'#ce364200');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='#cdc5e00d';ctx.lineWidth=1;for(let x=0;x<W;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
      ctx.strokeStyle='#d2cdf436';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(28,28,W-56,H-56,22);ctx.stroke();
      rr(58,54,229,42,20,lime);text('BRAIN AXEL',78,75,18,'#150f27',800,'left');text('MOTION STUDY / 144 BPM',302,75,18,'#cfc7e4',700,'left');
      rr(1080,54,139,42,20,coral);ctx.fillStyle=white;ctx.beginPath();ctx.arc(1104,75,7,0,Math.PI*2);ctx.fill();text(`SCENE 0${scene+1}`,1121,75,16,white,800,'left');
      rr(58,632,1164,8,4,'#ffffff28');rr(58,632,1164*(scene+Math.min(local,10)/10)/3,8,4,lime);
      if(scene===0){
        if(local<3.2){const a=Math.max(0,Math.min(1,local/.8));text('오늘은 조용히…',640,300,92,`rgba(250,247,255,${a})`,800,'center',2);text('아주 평범한 스크롤의 시작',640,382,18,muted,700)}
        else if(local<6.65){text('그냥 한 번만',640,286,92,white,800,'center',2);text('더 보고 끄자.',640,374,92,coral,800,'center',2);for(let i=0;i<5;i++)rr(524+i*50,470,38,16,i/4<(local-3.2)/3.45?lime:'#bcff3650')}
        else{text('…보다가?',640,288,108,pulse>.5?lime:white,800,'center',3);text('발끝이 먼저 움직였다',640,383,48,muted,800);rr(570,460,140,55,12,coral);for(let y of [472,486,500]){ctx.strokeStyle='#ffeedd99';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(590,y);ctx.lineTo(690,y);ctx.stroke()}}
      } else if(scene===1){
        for(let i=0;i<11;i++){let y=140+i*38,shift=(t*420+i*121)%180;ctx.strokeStyle='#bcff3642';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(30+shift,y);ctx.lineTo(230+shift,y);ctx.stroke();ctx.strokeStyle='#ff654d3c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W-250-shift,y+17);ctx.lineTo(W-40-shift,y+17);ctx.stroke()}
        text('브레인',647,254,108,'#ff654d60',800,'center',3);text('브레인',640,246,108,white,800,'center',3);
        if(local<2.45)text('악셀',640,374,108,lime,800,'center',3);else if(local<4.75){text('생각도',640,382,92,white,800,'center',3);text('드립도',640,476,92,lime,800,'center',3)}else if(local<7.1)text('풀가속!',640,405,108,coral,800,'center',4);else{text('한 번 밟으면',640,350,92,white,800,'center',3);text('생각도 드립도 풀가속!',640,438,48,lime,800,'center',2)}
      } else if(local<2.6){for(let j=0;j<3;j++)text('밈!',640+Math.sin(t*5+j*2.1)*280,280+j*90+Math.cos(t*4+j)*22,92,lime,800,'center',2);text('밈! 밈! 밈!',640,468,48,white,800,'center',2)}
      else if(local<5.2){text('생각도',640,315,92,white,800,'center',2);text('드립도',640,415,92,coral,800,'center',2);text('속도 UP',640,500,18,lime,800)}
      else if(local<7.25){text('풀가속—',640,365,108,lime,800,'center',4);for(let i=0;i<8;i++)rr(160+i*136,475,82,10,5,`rgba(255,101,77,${.35+.55*pulse})`)}
      else {if(local<7.48)text('브레인 악셀',640,354,92,white,800,'center',4);else{rr(312,266,656,188,34,lime);text('브레인 악셀',640,326,92,'#180f2b',800,'center',1);text('ON',640,423,92,coral,800,'center',1)}text('한 번 밟으면 생각도 드립도 풀가속!',640,506,18,muted,800)}
      text('BRAIN AXEL · ORIGINAL TYPE + SOUND',58,671,17,'#cdc5e0bb',800,'left');text(`00:${String(Math.floor(t)).padStart(2,'0')}`,1162,671,17,white,800,'right');
      const mx=58+1164*((t%(60/144))/(60/144));ctx.fillStyle=coral;ctx.beginPath();ctx.arc(mx,636,5,0,Math.PI*2);ctx.fill();
      readout.textContent=`${String(Math.floor(t)).padStart(2,'0')}초 / 30초 · 장면 ${scene+1} / 3 · 144 BPM`;
      if(playing&&t<30)raf=requestAnimationFrame(now=>render((now-started)/1000));else if(t>=30){playing=false;audio.pause()}
    }
    document.querySelector('#play').addEventListener('click',async()=>{cancelAnimationFrame(raf);audio.currentTime=0;try{await audio.play()}catch(e){}started=performance.now();playing=true;render(0)});
    audio.addEventListener('play',()=>{if(!playing){started=performance.now()-audio.currentTime*1000;playing=true;render(audio.currentTime)}});
    audio.addEventListener('pause',()=>{if(audio.currentTime<30)playing=false});
    render(0);
  </script>
</body>
</html>
