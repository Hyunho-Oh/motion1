<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text — typographic image</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #101927;
      font-family: Arial, Helvetica, sans-serif;
    }
    figure {
      width: min(100%, 900px);
      margin: 0;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border: 1px solid #ffffff24;
      border-radius: 28px;
      background: #f0eee8;
      box-shadow: 0 28px 80px #0007;
    }
    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <figure aria-label="A typographic image of the word text">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
      <title id="title">text</title>
      <desc id="desc">A bold typographic poster showing the word text in vivid orange and navy.</desc>
      <rect width="1200" height="900" fill="#f0eee8"/>
      <circle cx="1050" cy="155" r="220" fill="#ff5a36"/>
      <path d="M0 690 Q300 590 600 700 T1200 680 V900 H0Z" fill="#d8e1e2"/>
      <path d="M78 120H1122" stroke="#18263a" stroke-width="3" opacity=".35"/>
      <text x="82" y="180" fill="#18263a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="9">A SMALL TYPE STUDY</text>
      <text x="600" y="535" text-anchor="middle" fill="#18263a" font-family="Arial, Helvetica, sans-serif" font-size="250" font-weight="800" letter-spacing="-12">text</text>
      <rect x="82" y="748" width="94" height="12" rx="6" fill="#ff5a36"/>
      <text x="82" y="810" fill="#18263a" font-family="Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="4">WORDS MADE VISIBLE</text>
      <text x="1118" y="810" text-anchor="end" fill="#526074" font-family="Arial, sans-serif" font-size="19" letter-spacing="3">01 / 01</text>
    </svg>
  </figure>
</body>
</html>
